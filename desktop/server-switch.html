<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SkillBridge Server Connection</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #0B1F38;
      --surface: #132C4B;
      --cyan: #24B8DB;
      --text: #F7FAFC;
      --muted: #A3B8D1;
      --border: #264873;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--navy);
      color: var(--text);
    }
    h2 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .presets { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .preset-btn {
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
    }
    .preset-btn strong { display: block; color: var(--cyan); margin-bottom: 2px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .error { color: #FCA5A5; font-size: 12px; min-height: 16px; margin-bottom: 10px; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    .actions button {
      padding: 9px 16px;
      border-radius: 9px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .cancel { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .save { background: var(--cyan); color: #05162B; }
  </style>
</head>
<body>
  <h2>Central SkillBridge Server</h2>
  <p>Select an environment or enter a custom backend URL shared with Web and Android.</p>
  <div class="presets">
    <button id="presetDev" class="preset-btn" type="button"><strong>Development Ecosystem</strong><span id="devUrl"></span></button>
    <button id="presetShared" class="preset-btn" type="button"><strong>Shared Production Ecosystem</strong><span id="sharedUrl"></span></button>
    <button id="presetLocal" class="preset-btn" type="button"><strong>Local Backend</strong><span>http://localhost:3000</span></button>
  </div>
  <label for="customUrl">Custom Server URL</label>
  <input id="customUrl" type="url" placeholder="https://..." />
  <div id="errBox" class="error"></div>
  <div class="actions">
    <button id="cancelBtn" class="cancel" type="button">Cancel</button>
    <button id="saveBtn" class="save" type="button">Apply & Connect</button>
  </div>
  <script>
    (async () => {
      const api = window.skillbridgeDesktop;
      const input = document.getElementById('customUrl');
      const errBox = document.getElementById('errBox');
      if (!api) return;
      const cfg = await api.getServerConfig();
      input.value = cfg.serverUrl || '';
      document.getElementById('devUrl').textContent = cfg.presets.development;
      document.getElementById('sharedUrl').textContent = cfg.presets.shared;

      document.getElementById('presetDev').addEventListener('click', () => api.setServerUrl(cfg.presets.development));
      document.getElementById('presetShared').addEventListener('click', () => api.setServerUrl(cfg.presets.shared));
      document.getElementById('presetLocal').addEventListener('click', () => api.setServerUrl(cfg.presets.local));
      document.getElementById('cancelBtn').addEventListener('click', () => api.closeDialog());
      document.getElementById('saveBtn').addEventListener('click', async () => {
        errBox.textContent = '';
        try {
          await api.setServerUrl(input.value);
        } catch (err) {
          errBox.textContent = err?.message || 'Enter a valid http:// or https:// URL.';
        }
      });
    })();
  </script>
</body>
</html>
