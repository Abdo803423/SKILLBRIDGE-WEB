<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SkillBridge</title>
    <script>
      (function () {
        var loc = window.location;
        var pathSegmentsToKeep = loc.pathname.split('/').length > 2 && loc.hostname.endsWith('github.io') ? 1 : 0;
        var base = loc.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/');
        var fullTarget = loc.pathname + loc.search + loc.hash;
        loc.replace(loc.protocol + '//' + loc.host + base + '/?p=' + encodeURIComponent(fullTarget));
      })();
    </script>
  </head>
  <body></body>
</html>
