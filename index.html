    <script>
      // Restore SPA path when redirected from static hosting 404.html (e.g. GitHub Pages)
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirected = params.get('p');
        if (redirected) {
          params.delete('p');
          var rest = params.toString();
          var target = redirected + (rest ? '?' + rest : '') + window.location.hash;
          window.history.replaceState(null, '', target);
        }
      })();
    </script>
